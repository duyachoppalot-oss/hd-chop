# nginx rate limit for the HD Chop API (docs/FIX_PLAN.md A2).
# The live site config is not in the repo; Laken pastes these by hand on the server.
#
# 1) http context — save as /etc/nginx/conf.d/hdchop-ratelimit.conf
#    (Debian/Ubuntu nginx.conf includes conf.d/*.conf inside http {}):

limit_req_zone $binary_remote_addr zone=hdchop_api:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

# 2) server context — in /etc/nginx/sites-available/hd-chop-api, inside the
#    `listen 443 ssl` server block for hdchop.5.161.100.126.nip.io, add this
#    location ABOVE the existing `location / { proxy_pass ... }` and copy the
#    proxy_* lines from that block into it:
#
#    location /v1/ {
#        limit_req zone=hdchop_api burst=20 nodelay;
#        proxy_pass http://127.0.0.1:3001;
#        # ...same proxy_set_header lines as `location /`
#    }
#
# 3) test + reload:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4) check from the Mac: scripts/deploy/check-ratelimit.sh
#    expect ~21 x 200 then 429s; one request per ~2 s refills a slot.
#
# Behaviour: 30 requests/min per client IP sustained, bursts of 20 served at once
# (nodelay), anything beyond -> 429. A bike pick + a few searches is well under that.
# Caveat: riders behind one carrier NAT share an IP; raise rate/burst if 429s show
# up in /var/log/nginx/error.log ("limiting requests") from real use.
# Remove: delete the conf.d file and the location block, nginx -t, reload.
